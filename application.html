<body>

<header>

    <div class="logo">
        BLEST <span>RUSSIA</span>
    </div>

    <a href="index.html" class="telegram">
        🏠 Главная
    </a>

</header>


<main>

<section class="application">

    <div class="application-box">

        <div class="label">
            🧪 НАБОР ТЕСТЕРОВ

            Заполни анкету ниже. После отправки

        </p>


        <form id="applicationForm">

            <label>
                👤 Имя
            </label>

            <input
                type="text"
                id="name"
                placeholder="Введите ваше имя"
                required
            >


            <!-- ИГРОВОЙ НИК -->

            <label>
                🎮 Игровой ник
            </label>

            <input
                type="text"
                id="nickname"
                placeholder="Например: SVOYAK"
                required
            >


            <!-- ВОЗРАСТ -->

            <label>
                🎂 Возраст
            </label>

            <input
                type="number"
                id="age"
                min="13"
                max="100"
                placeholder="Введите возраст"
                required
            >


            <!-- ИГРОВОЙ ОПЫТ -->

            <label>
                🎮 Игровой опыт
            </label>

            <textarea
                id="experience"
                placeholder="Расскажи немного о своём игровом опыте"
                required
            ></textarea>

                💻 Устройство
            </label>

                    Выберите устройство
                </option>

                    📱 Android
                </option>

                <option value="iPhone">
                    📱 iPhone
                </option>

                <option value="PC">
                    💻 PC
                </option>

            </select>
