```html
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Заявка на тест — BLEST RUSSIA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        BLEST <span>RUSSIA</span>
    </div>

    <a href="index.html" class="telegram">
        🏠 Главная
    </a>

</header>


<main>

<section class="application">

    <div class="application-box">

        <div class="label">
            🧪 НАБОР ТЕСТЕРОВ
        </div>

        <h1>
            Заявка на<br>
            <span>тестирование</span>
        </h1>

        <p class="application-description">
            Заполни анкету ниже. После отправки
            администрация рассмотрит твою заявку.
        </p>


        <form id="applicationForm">


            <label>
                👤 Имя или игровой ник
            </label>

            <input
                type="text"
                id="name"
                placeholder="Например: SVOYAK"
                required
            >


            <label>
                🎂 Возраст
            </label>

            <input
                type="number"
                id="age"
                min="13"
                max="100"
                placeholder="Введите возраст"
                required
            >


            <label>
                🎮 Игровой опыт
            </label>

            <textarea
                id="experience"
                placeholder="Расскажи немного о своём игровом опыте"
                required
            ></textarea>


            <label>
                💻 Устройство
            </label>

            <select id="device" required>

                <option value="">
                    Выберите устройство
                </option>

                <option value="Android">
                    📱 Android
                </option>

                <option value="iPhone">
                    📱 iPhone
                </option>

                <option value="PC">
                    💻 PC
                </option>

            </select>


            <label>
                💡 Почему хочешь стать тестером?
            </label>

            <textarea
                id="reason"
                placeholder="Напиши причину"
                required
            ></textarea>


            <label>
                ⏱ Сколько времени сможешь уделять тестированию?
            </label>

            <input
                type="text"
                id="time"
                placeholder="Например: 1–2 часа в день"
                required
            >


            <label>
                📱 Telegram
            </label>

            <input
                type="text"
                id="telegram"
                placeholder="@username"
                required
            >


            <label class="checkbox">

                <input
                    type="checkbox"
                    id="rules"
                    required
                >

                <span>
                    Я согласен соблюдать правила
                    тестирования проекта.
                </span>

            </label>


            <button
                type="submit"
                class="submit-button"
            >
                🚀 Отправить заявку
            </button>


        </form>


        <div
            id="success"
            class="success-message"
        >
            ✅ Заявка отправлена!

            <br><br>

            Спасибо за участие.
            Администрация рассмотрит твою заявку.
        </div>


    </div>

</section>

</main>


<footer>

    <h3>BLEST RUSSIA</h3>

    <p>
        © 2026 BLEST RUSSIA
    </p>

</footer>


<script src="application.js"></script>

</body>

</html>
```
